name: URBIS CI
on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]
permissions:
  contents: read
  packages: write

env:
  VERSION: 0.5.0-alpha.1
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/urbis-api
  NOTIFICATION_IMAGE: ghcr.io/${{ github.repository_owner }}/urbis-notification-worker
  EVENT_RELAY_IMAGE: ghcr.io/${{ github.repository_owner }}/urbis-event-relay

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml
      - run: npm run test:all
      - run: npm run test:coverage | tee coverage.txt
      - name: Enforce core line coverage >=80%
        run: |
          python - <<'PY'
          import re
          s=open('coverage.txt',encoding='utf-8').read()
          m=re.search(r'all files\s+\|\s+([0-9.]+)',s)
          assert m, 'coverage summary not found'
          assert float(m.group(1)) >= 80.0, m.group(1)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.txt}

  api-build:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run build
      - run: npm audit --audit-level=critical

  web-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install && npm run build
        working-directory: apps/web-central-react
      - run: npm install && npm run build
        working-directory: apps/web-public-next

  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: apps/citizen-flutter
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: apps/field-flutter

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  build-images:
    if: github.event_name == 'push'
    needs: [core-tests, api-build, web-builds, flutter-tests, container-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.VERSION }},${{ env.API_IMAGE }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/notification-worker.Dockerfile
          push: true
          tags: ${{ env.NOTIFICATION_IMAGE }}:${{ env.VERSION }},${{ env.NOTIFICATION_IMAGE }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/event-relay.Dockerfile
          push: true
          tags: ${{ env.EVENT_RELAY_IMAGE }}:${{ env.VERSION }},${{ env.EVENT_RELAY_IMAGE }}:${{ github.sha }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [build-images]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          test -n "$KUBE_CONFIG_B64"
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
      - name: Deploy manifests
        run: kubectl apply -f infra/k8s/
      - name: Pin images built from this commit
        run: |
          kubectl -n urbis set image deployment/urbis-api api=${API_IMAGE}:${GITHUB_SHA}
          kubectl -n urbis set image deployment/urbis-notification-worker worker=${NOTIFICATION_IMAGE}:${GITHUB_SHA}
      - name: Wait for API rollout
        run: kubectl -n urbis rollout status deployment/urbis-api --timeout=180s
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: grafana/setup-k6-action@v1
      - name: Validate staging realtime/API gates
        env:
          URBIS_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          URBIS_WS_BASE_URL: ${{ secrets.STAGING_WS_BASE_URL }}
          URBIS_CITIZEN_EMAIL: ${{ secrets.STAGING_CITIZEN_EMAIL }}
          URBIS_OPERATOR_EMAIL: ${{ secrets.STAGING_OPERATOR_EMAIL }}
          URBIS_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          URBIS_TEST_LAT: ${{ secrets.STAGING_TEST_LAT }}
          URBIS_TEST_LON: ${{ secrets.STAGING_TEST_LON }}
        run: |
          test -n "$URBIS_BASE_URL"
          npm run test:staging:gates
      - name: Validate staging load gate (k6)
        env:
          URBIS_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          test -n "$URBIS_BASE_URL"
          k6 run tests/performance/urbis-load.k6.js
